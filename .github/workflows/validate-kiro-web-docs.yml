name: Validate kiro-web-docs

# 対象ブランチは main のみ。develop 運用はしない。
on:
  push:
    branches: [ main ]
    paths:
      - 'kiro-web-docs/**'
      - 'README.md'
      - 'scripts/kiro-web-docs/**'
      - 'Makefile'
      - '.github/workflows/validate-kiro-web-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'kiro-web-docs/**'
      - 'README.md'
      - 'scripts/kiro-web-docs/**'
      - 'Makefile'
      - '.github/workflows/validate-kiro-web-docs.yml'
  schedule:
    # nightly。公式サイトの改廃によるリンク切れと、更新の掲載漏れを検知する。
    #
    # ⚠️ Kiro Web は **changelog に現れない docs 更新がある**（F-W16。実測で
    #    最新エントリより新しい docs 更新が4件）。エントリの追加頻度は不定
    #    （Dec → 5か月空白 → May 以降は月1〜2件）だが、docs 側は
    #    それより高頻度で変わりうるため nightly で監視する。
    - cron: '31 19 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 公開範囲の機械検証。ローカル管理対象（work_plans / 05_meta /
      # 06_embedded-docs / work_records）が公開ツリーに混入していないか、
      # 公開ファイルにローカル絶対パスが混じっていないかを見る。
      # 公開事故は取り返しがつかないので最初に実行する。
      - name: 公開範囲チェック（ローカル管理対象・ローカル絶対パスの混入）
        run: make check-kiro-web-ignore

      # ネットワーク不要の全チェック
      # （links / structure / coverage / counts / consistency / notation）。
      - name: 全チェック（ネットワーク不要）
        run: make check-kiro-web-all

      # ⚠️ 重要: このジョブには一次情報スナップショット（06_embedded-docs/）が無い。
      # .gitignore 対象のため clone されず、次の2つが「スキップして exit 0」になる。
      #   - check-kiro-web-coverage … changelog の網羅性と**折りたたみ項目数**の一致
      #   - check-kiro-web-counts の公式 HTML 照合部分
      #
      # **これらは下の verify-with-snapshot ジョブが公式から都度取得して検証する。**
      # 本ジョブの green だけでは網羅性を保証しない、という関係は変わらない。
      - name: 網羅性チェックの状態を明示
        run: |
          if ls kiro-web-docs/06_embedded-docs/*/changelog/*.html >/dev/null 2>&1; then
            echo "::notice::一次情報スナップショットがあるため網羅性を検証しました"
          else
            echo "::notice::本ジョブでは網羅性チェックと公式 HTML との照合はスキップされました。" \
                 "これらは verify-with-snapshot ジョブが公式から都度取得して検証します。"
          fi

      # 外部サイトに依存するチェックは PR では実行しない（レート制限・一時障害で
      # PR が赤くなるのを避ける）。push / nightly / 手動で実施する。
      # 重要 URL のみに絞ることで、外部要因の failure と本当のリンク切れを
      # 切り分けやすくする（全件は make check-kiro-web-urls）。
      - name: 重要 URL の到達性（PR ではスキップ）
        if: github.event_name != 'pull_request'
        run: make check-kiro-web-urls-important

      # 新エントリ・docs 更新の検知。
      # sitemap（主系統1）＋索引 RSC（主系統2）で判定する。
      # ⚠️ フィードには依存しない（**25件のローリングウィンドウ**のため、Web 全 19 エントリ
      #    のうち 7 件しか入らない。網羅性の根拠にできない — 2026-09-13 実測）。
      # ⚠️ **docs の最新更新日（S4）も見る**。changelog に現れない更新があるため（F-W16）。
      # ⚠️ ここでの failure は「文書のバグ」ではなく「更新作業が必要」の合図。
      #    また `changelog/web/page/N` が出現した場合もここで落ちる（F-W15。
      #    索引の全ページ巡回への実装変更が必要という意味）。
      - name: 新エントリ・docs 更新の検知（nightly と手動のみ）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make check-kiro-web-freshness

  # ============================================================
  # 公式から一次情報を都度取得して検証するジョブ
  # ============================================================
  # 2026-09-13 追加。それまで CI は snapshot を持たないため、
  #   - changelog の網羅性（折りたたみ項目 21 件を含む）
  #   - 件数の正準値と公式 HTML の照合（S2 / S5 / S6 / S7）
  #   - 出典日と公式 `dateModified` の照合（54 箇所）
  # を検証できず、「未検証です」と出力してスキップしていた（誤 green ではないが、
  # **CI だけでは守れていなかった**）。公式から都度取得して塞ぐ。
  #
  # 設計上の判断:
  #   - **PR でも実行する。** 上の validate ジョブは「外部依存は PR でやらない」方針だが、
  #     このジョブは外部依存そのものが目的であり、PR 時点で守れないと意味がない。
  #     一時障害は再試行（--retries 3）で吸収する。
  #   - **取得したスナップショットはコミットしない。** kiro.dev の複製であり再配布しない。
  #     置き場（06_embedded-docs/）は .gitignore 対象。
  #   - **スキップを成功にしない。** 取得できなければ verify も失敗する
  #     （`verify-kiro-web-with-snapshot` はスナップショット不在で exit 1）。
  #   - 公式サイトへの負荷を抑えるため `--delay 0.5` を入れる（実測 49 リクエスト・約 40 秒）。
  verify-with-snapshot:
    runs-on: ubuntu-latest
    # validate が落ちる状態（文書自体の不整合）で公式へ取りに行かない。
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 失敗したときに「外部要因」か「文書の問題」かを切り分けられるよう、
      # 取得と検証をステップとして分ける。
      - name: 一次情報スナップショットを公式から取得
        id: capture
        run: |
          make capture-kiro-web-snapshot \
            CAPTURE_DATE=ci-${{ github.run_id }} RETRIES=3 DELAY=0.5

      - name: 取得失敗時の切り分け情報
        if: failure() && steps.capture.outcome == 'failure'
        run: |
          echo "::error::公式サイトからの取得に失敗しました。" \
               "これは**文書の問題ではなく外部要因の可能性**があります。" \
               "manifest.tsv に全リクエストの結果が記録されています。" \
               "一時的な障害であればワークフローの再実行で解消します。"
          find kiro-web-docs/06_embedded-docs -name manifest.tsv \
            -exec sh -c 'echo "--- {} ---"; grep -v "success" "{}" | head -20' \;

      # 網羅性・件数の公式照合・出典日照合。
      # スナップショットが無ければ**失敗する**（スキップして成功にしない）。
      - name: スナップショットを使う検証（網羅性・件数・出典日）
        run: |
          make verify-kiro-web-with-snapshot \
            HTML_DIR=kiro-web-docs/06_embedded-docs/ci-${{ github.run_id }}/changelog/entries \
            DOCS_HTML_DIR=kiro-web-docs/06_embedded-docs/ci-${{ github.run_id }}/docs

      # スナップショットが公開ツリーに混入していないことを確認する。
      # 取得物は .gitignore 対象なので git status はクリーンなはず。
      - name: 取得物が公開ツリーに混入していないか
        run: |
          make check-kiro-web-ignore
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::取得したスナップショットが git の管理対象に入っています（再配布事故）"
            git status --porcelain
            exit 1
          fi
          echo "取得物は .gitignore 対象です（git status はクリーン）"
