name: 🐛 Bug Report
description: Report a bug in the documentation
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **Important**: This is an unofficial documentation project. For official Kiro issues, please use the [official repository](https://github.com/kirodotdev/Kiro/issues).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you found in the documentation
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should the documentation say or do instead?
      placeholder: Tell us what you expected!
    validations:
      required: true

  - type: input
    id: document
    attributes:
      label: Document/Page
      description: Which document or page contains the bug?
      placeholder: e.g., kiro-web-docs/04_reference/04_limits.md
    validations:
      required: true

  - type: input
    id: changelog-entry
    attributes:
      label: Kiro Web changelog entry
      description: |
        Kiro Web has no version numbers. If this concerns a specific update,
        give the changelog entry date and slug instead.
      placeholder: e.g., 2026-07-01 / iam-roles-and-authorize-powers-for-third-party-services

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here
      placeholder: Screenshots, links, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/kamogashira-sys/kiro-web-docs/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
